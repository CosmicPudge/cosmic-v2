<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Las Vegas Motor Speedway</title>
  <desc id="desc">A restrained neon track visualization for the Las Vegas Motor Speedway.</desc>
  <defs>
    <linearGradient id="sky" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#111a35"/>
      <stop offset="0.55" stop-color="#281c4e"/>
      <stop offset="1" stop-color="#090b17"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#sky)"/>
  <path d="M0 670 C260 570 440 740 700 650 S1160 560 1600 680 L1600 900 L0 900 Z" fill="#0a1020" opacity=".9"/>
  <path d="M170 510 C250 275 560 170 980 260 C1260 320 1375 490 1220 635 C1035 806 510 785 265 650 C190 608 145 560 170 510 Z" fill="none" stroke="#ff4f9a" stroke-width="28" opacity=".45" filter="url(#glow)"/>
  <path d="M170 510 C250 275 560 170 980 260 C1260 320 1375 490 1220 635 C1035 806 510 785 265 650 C190 608 145 560 170 510 Z" fill="none" stroke="#ffd166" stroke-width="7" opacity=".9"/>
  <path d="M275 505 C350 350 590 285 895 340 C1075 372 1170 470 1080 545 C950 660 590 660 375 590" fill="none" stroke="#eef4ff" stroke-width="4" opacity=".42"/>
  <circle cx="1175" cy="160" r="105" fill="#f4d58a" opacity=".08"/>
</svg>
