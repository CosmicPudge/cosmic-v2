<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
<defs>
 <linearGradient id="space" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#02030d"/><stop offset=".48" stop-color="#09051d"/><stop offset="1" stop-color="#18052c"/></linearGradient>
 <radialGradient id="planet" cx=".55" cy=".04" r=".85"><stop stop-color="#8f6cff"/><stop offset=".08" stop-color="#5031b0"/><stop offset=".32" stop-color="#211052"/><stop offset=".72" stop-color="#080617"/><stop offset="1" stop-color="#02030a"/></radialGradient>
 <radialGradient id="moon" cx=".35" cy=".28"><stop stop-color="#7d5ab8"/><stop offset=".45" stop-color="#28123f"/><stop offset="1" stop-color="#080713"/></radialGradient>
 <filter id="neb" x="-30%" y="-30%" width="160%" height="160%">
  <feTurbulence type="fractalNoise" baseFrequency=".006 .014" numOctaves="5" seed="23" result="n"/>
  <feColorMatrix in="n" values="1.6 0 0 0 .15  0 .2 1.9 0 -.1  0 0 .8 0 .3  0 0 0 1 0" result="c"/>
  <feGaussianBlur stdDeviation="5"/>
 </filter>
 <filter id="glow"><feGaussianBlur stdDeviation="14" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="texture"><feTurbulence type="fractalNoise" baseFrequency=".012" numOctaves="4" seed="7" result="t"/><feBlend in="SourceGraphic" in2="t" mode="screen"/></filter>
 <pattern id="stars" width="137" height="109" patternUnits="userSpaceOnUse">
  <circle cx="9" cy="17" r="1.1" fill="#fff"/><circle cx="48" cy="73" r=".7" fill="#b8c8ff"/><circle cx="101" cy="31" r="1.35" fill="#e7c8ff"/><circle cx="124" cy="94" r=".65" fill="#fff"/><circle cx="72" cy="9" r=".55" fill="#fff"/>
 </pattern>
</defs>
<rect width="1600" height="900" fill="url(#space)"/>
<ellipse cx="850" cy="130" rx="760" ry="300" fill="#6826c7" opacity=".44" filter="url(#neb)"/>
<ellipse cx="440" cy="390" rx="520" ry="360" fill="#9d2ed4" opacity=".34" filter="url(#neb)"/>
<ellipse cx="1370" cy="380" rx="390" ry="330" fill="#5d2ecb" opacity=".28" filter="url(#neb)"/>
<rect width="1600" height="900" fill="url(#stars)" opacity=".9"/>
<circle cx="1260" cy="104" r="68" fill="url(#moon)" filter="url(#texture)" opacity=".95"/>
<ellipse cx="1160" cy="565" rx="690" ry="455" fill="url(#planet)" filter="url(#texture)"/>
<path d="M505 278 C760 155 1180 120 1605 285" fill="none" stroke="#bfa9ff" stroke-width="5" opacity=".9" filter="url(#glow)"/>
<circle cx="1480" cy="174" r="14" fill="#fff" filter="url(#glow)"/><circle cx="1480" cy="174" r="46" fill="#e8b5ff" opacity=".32" filter="url(#glow)"/>
<g opacity=".85" filter="url(#glow)" fill="#fff"><circle cx="804" cy="76" r="2"/><circle cx="675" cy="122" r="2.5"/><circle cx="1010" cy="88" r="2"/><circle cx="572" cy="211" r="2"/></g>
</svg>